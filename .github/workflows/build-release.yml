name: Build and Release APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up 6GB Swap Space (OOM Prevention)
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+ParallelRefProcEnabled\" -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools/ -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing release APK with custom secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            $BUILD_TOOLS/apksigner sign --ks release.keystore \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk
            rm -f release.keystore
          elif [ ! -f "app/build/outputs/apk/release/app-release.apk" ] && [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "No custom keystore secret found. Signing release APK with debug key fallback..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
            rm -f debug.keystore
          fi

      - name: Prepare APK Artifact Names
        id: prepare_apks
        run: |
          GIT_COUNT=$(git rev-list --count HEAD || echo "1")
          VERSION_NAME="v3.0.${GIT_COUNT}"
          
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk "release_assets/Echo-${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release_assets/Echo-${VERSION_NAME}-debug.apk"
          
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          ls -la release_assets/

      - name: Upload Build Artifacts to Actions Summary
        uses: actions/upload-artifact@v4
        with:
          name: Echo-APKs-${{ env.VERSION_NAME }}
          path: release_assets/*.apk
          retention-days: 14

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Echo {0}', env.VERSION_NAME) }}
          draft: false
          prerelease: false
          files: release_assets/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
